# Dependency posture (issue #29, decision B — security-only):
#   - RustSec advisories fail CI via the `audit` job (covers bundled
#     SQLite C code compiled into the binary). Landed with 5 TLS-stack
#     vulnerabilities already in the lockfile (rustls / webpki /
#     quinn-proto) — cleared in the same PR; proof the guard earns its
#     place on day one.
#   - Dependabot ALERTS are active (automatic on public repos).
#   - Version-update PRs are deliberately NOT configured: dependency
#     restraint is a design property; bumps are reviewed manually.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deny warnings in CI so unused variables / new clippy lints surface as
  # failures rather than noise in PR review.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS for the Apple Silicon primary target; Linux for the
        # air-gapped/server deployment story.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/registry/index
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      # `bundled` SQLite compiles from source — give the C toolchain a
      # moment; needs cc/clang which both runners have by default.
      - name: Build (tests included)
        run: cargo build --all-targets --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
        # The suite binds ephemeral 127.0.0.1 ports and spawns agent
        # subprocesses; no external services needed (LLM_BASE_URL points
        # at a closed port by default in harnesses).

  # Security audit (issue #29, decision B: security-only posture). No
  # version-update PRs — dependency restraint is a design property here.
  # What IS automated: RustSec advisory checks on every push/PR. This is
  # the guard that matters for `rusqlite` bundled (SQLite's C source is
  # compiled into the binary; a CVE there ships silently in releases).
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts the result as a check run; on push to a
    # branch that needs the `checks: write` permission (pull_request
    # events get it implicitly, push events to main do not — found when
    # the first post-merge run failed with "Resource not accessible by
    # integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          # Fails the job when a vulnerability matches an entry in
          # Cargo.lock. Warnings without a category are non-blocking
          # (unmaintained crates surface as warnings, not failures).
          token: ${{ secrets.GITHUB_TOKEN }}

