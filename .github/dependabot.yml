# Dependency updates — deliberately scoped (issue discussion: toolchain/CI drift).
#
# 1. GitHub Actions weekly — the workflow definitions are the supply-chain
#    surface (actions/checkout, rust-toolchain, cache); bumps are cheap to
#    review and keep CI from silently pinning stale, vulnerable versions.
# 2. Cargo grouped monthly — one PR for all minor/patch bumps keeps the
#    review load at ~1/month while still surfacing yanked/vulnerable
#    releases quickly (RustSec feeds it automatically).
#    Major bumps stay manual: this project treats dependency restraint
#    (single binary, air-gapped builds) as a design property, not an
#    accident to automate away.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels: ["dependencies"]
